<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>New Attestation Visit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/yvy/yvy.css">
</head>
<body>
<div class="wrap">

<div class="hdr-mark">
  <img src="https://ac4otvimls3ptbdw.public.blob.vercel-storage.com/Icon%20Only.png" alt="Premier Assist">
</div>

<!-- ── INTAKE FORM ── -->
<div class="step on card" id="sform">
  <div class="slbl">New provider attestation visit</div>

  <!-- Mode: send the patient a link, or fill their details in now -->
  <div class="seg" id="modeseg" style="margin-bottom:1.5rem">
    <div class="sopt sel" data-mode="send" onclick="selMode(this)">Send link to patient</div>
    <div class="sopt" data-mode="staff" onclick="selMode(this)">Schedule for patient</div>
  </div>

  <!-- Always-on basics -->
  <div class="ffrow">
    <div class="ff"><label for="fn">Patient first name</label><input type="text" id="fn" placeholder="First name" autocomplete="off"></div>
    <div class="ff"><label for="ln">Patient last name</label><input type="text" id="ln" placeholder="Last name" autocomplete="off"></div>
  </div>

  <div class="ff"><label for="dob">Date of birth</label><input type="text" id="dob" data-mask="date" inputmode="numeric" placeholder="MM/DD/YYYY" maxlength="10"></div>

  <div style="margin-bottom:22px">
    <span class="flbl">Visit language</span>
    <div class="seg" id="langseg">
      <div class="sopt sel" data-lang="en" onclick="selLang(this)">English</div>
      <div class="sopt" data-lang="es" onclick="selLang(this)">Español</div>
    </div>
  </div>

  <div class="ff">
    <label for="entity">SCN Lead Entity</label>
    <select id="entity" required><option value="" selected disabled hidden></option></select>
  </div>

  <!-- SEND MODE: patient email (required) -->
  <div id="sendFields">
    <div class="ff"><label for="pemail">Patient email</label><input type="email" id="pemail" placeholder="patient@example.com" autocomplete="off"></div>
  </div>

  <!-- STAFF MODE: enter the patient's details now -->
  <div id="staffFields" style="display:none">
    <div class="slbl" style="margin-top:.5rem">Patient's address</div>
    <div class="ff"><label for="addr">Street address</label><input type="text" id="addr" placeholder="123 Main St" autocomplete="off"></div>
    <div class="ff"><label for="city">City</label><input type="text" id="city" placeholder="Brooklyn" autocomplete="off"></div>
    <div class="ffrow narrow-right">
      <div class="ff"><label for="state">State</label><input type="text" id="state" value="NY" maxlength="2" placeholder="NY" autocomplete="off"></div>
      <div class="ff"><label for="zip">ZIP code</label><input type="text" id="zip" inputmode="numeric" maxlength="10" placeholder="11204" autocomplete="off"></div>
    </div>

    <div class="slbl" style="margin-top:1.5rem">Insurance</div>
    <div class="ff"><label for="carrier">Insurance carrier</label><input type="text" id="carrier" placeholder="e.g. Fidelis Care"></div>
    <div class="ff"><label for="memberid">Insurance member ID</label><input type="text" id="memberid" placeholder="Member ID"></div>

    <div class="f" style="margin-bottom:22px">
      <label class="flbl">Insurance card photos <span class="opt">optional</span></label>
      <div class="upgrid">
        <label class="uptile" id="tile-front">
          <input type="file" accept="image/*" onchange="pickImage(this,'front')">
          <svg class="upicon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7H7l1-1.6A1 1 0 0 1 8.9 5h6.2a1 1 0 0 1 .9.4L17 7h1.5A1.5 1.5 0 0 1 20 8.5v8A1.5 1.5 0 0 1 18.5 18h-13A1.5 1.5 0 0 1 4 16.5z"/><circle cx="12" cy="12" r="3.2"/></svg>
          <span class="uplbl">Front of card</span>
          <span class="upnote">Tap to take a photo or upload</span>
        </label>
        <label class="uptile" id="tile-back">
          <input type="file" accept="image/*" onchange="pickImage(this,'back')">
          <svg class="upicon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7H7l1-1.6A1 1 0 0 1 8.9 5h6.2a1 1 0 0 1 .9.4L17 7h1.5A1.5 1.5 0 0 1 20 8.5v8A1.5 1.5 0 0 1 18.5 18h-13A1.5 1.5 0 0 1 4 16.5z"/><circle cx="12" cy="12" r="3.2"/></svg>
          <span class="uplbl">Back of card</span>
          <span class="upnote">Tap to take a photo or upload</span>
        </label>
      </div>
    </div>

    <div class="slbl" style="margin-top:1.5rem">Schedule the visit</div>
    <div class="note" id="schednote"></div>
    <div class="ffrow">
      <div class="ff"><label for="vdate">Visit date</label><input type="text" id="vdate" data-mask="date" inputmode="numeric" placeholder="MM/DD/YYYY" maxlength="10"></div>
      <div class="ff">
        <label for="vtime">Visit time</label>
        <select id="vtime" required><option value="" selected disabled hidden></option></select>
      </div>
    </div>
  </div>

  <div class="errmsg" id="errmsg"></div>

  <div class="nav"><div></div><button class="btn btn-p" id="createbtn" onclick="createVisit()">Create &amp; send to patient →</button></div>
</div>

<!-- ── SUCCESS ── -->
<div class="step card" id="sok">
  <div class="okwrap" style="padding-bottom:1rem">
    <div class="okicon">✓</div>
    <h2 id="oktitle">Visit created</h2>
    <p id="okmsg">Share this personal link with the patient to complete their information and pick a visit time.</p>
  </div>
  <div class="linkbox" id="linkbox">
    <input type="text" id="plink" readonly onclick="this.select()">
    <button class="btn" id="copybtn" onclick="copyLink()">Copy</button>
  </div>
  <div class="okwrap" style="padding:0 1.5rem 2rem">
    <button class="btn" onclick="another()">Create another visit</button>
  </div>
</div>

</div>

<script src="/yvy/config.js"></script>
<script src="/yvy/calendar.js"></script>
<script>
const $ = id => document.getElementById(id);
let lang = 'en', mode = 'send';
const images = { front: null, back: null };
const RELS = ['Self','Parent','Legal guardian','Spouse','Other family member','Other'];

// Field-specific validation messages
const MSG = {
  fn:"Please enter the patient's first name",
  ln:"Please enter the patient's last name",
  dob:'Please enter a valid date of birth (MM/DD/YYYY)',
  entity:'Please choose an SCN lead entity',
  pemail:"Please enter the patient's email",
  addr:'Please enter the street address',
  city:'Please enter the city',
  state:'Please enter the state',
  zip:'Please enter the ZIP code',
  carrier:'Please enter the insurance carrier',
  memberid:'Please enter the insurance member ID',
  vdate:'Please enter a valid visit date (MM/DD/YYYY)',
  vtime:'Please choose a visit time'
};

// Populate lead entity dropdown from config.js
(function(){
  const sel = $('entity');
  (window.YVY_LEAD_ENTITIES || []).forEach(n => {
    const o = document.createElement('option'); o.value = o.textContent = n; sel.appendChild(o);
  });
})();

function fmtMins(mins){const h=Math.floor(mins/60),m=mins%60;return `${((h+11)%12)+1}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`}

function populateSlots(){
  const w = window.YVY_SCHEDULE[lang] || window.YVY_SCHEDULE.en;
  $('schednote').textContent = `Visits are Monday to Friday, between ${fmtMins(w.open)} and ${fmtMins(w.close)} for ${lang==='es'?'Spanish':'English'} visits.`;
  const vt=$('vtime');
  vt.innerHTML='<option value="" selected disabled hidden></option>';
  for(let m=w.open; m+window.YVY_SCHEDULE.slotMinutes<=w.close; m+=window.YVY_SCHEDULE.slotMinutes){
    const o=document.createElement('option');
    o.value=`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
    o.textContent=fmtMins(m); vt.appendChild(o);
  }
}
populateSlots();

function selMode(el){
  document.querySelectorAll('#modeseg .sopt').forEach(s=>s.classList.remove('sel'));
  el.classList.add('sel');
  mode = el.dataset.mode;
  const staff = mode==='staff';
  $('staffFields').style.display = staff ? 'block':'none';
  $('sendFields').style.display  = staff ? 'none':'block';
  $('createbtn').textContent = staff ? 'Schedule visit →' : 'Create & send to patient →';
}

function selLang(el){
  document.querySelectorAll('#langseg .sopt').forEach(s=>s.classList.remove('sel'));
  el.classList.add('sel');
  lang = el.dataset.lang;
  populateSlots(); // English/Spanish windows differ
}

// Date mask (MM/DD/YYYY) on all masked inputs
function formatDateMask(d){d=d.replace(/\D/g,'').slice(0,8);let o=d.slice(0,2);if(d.length>=3)o+='/'+d.slice(2,4);if(d.length>=5)o+='/'+d.slice(4,8);return o}
document.querySelectorAll('input[data-mask="date"]').forEach(el=>{
  el.addEventListener('input',e=>{const del=e.inputType&&e.inputType.startsWith('delete');const f=formatDateMask(el.value);el.value=f;if(!del)el.setSelectionRange(f.length,f.length)});
});

// Calendar pickers — DOB allows past dates (no weekend rule); visit date is
// future weekdays only, matching the scheduling rules.
(function(){
  const today=new Date();today.setHours(0,0,0,0);
  attachCalendar($('dob'), { locale:'en', max:today, minYear:1900, maxYear:today.getFullYear() });
  attachCalendar($('vdate'), { locale:'en', min:today, disableWeekends:true, maxYear:today.getFullYear()+1 });
})();
function isValidDate(s){const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s);if(!m)return false;const d=new Date(+m[3],+m[1]-1,+m[2]);return d.getFullYear()===+m[3]&&d.getMonth()===+m[1]-1&&d.getDate()===+m[2]}
function maskToIso(s){const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s);return m?`${m[3]}-${m[1]}-${m[2]}`:''}
function isWeekend(iso){const [y,mo,d]=iso.split('-').map(Number);const dow=new Date(y,mo-1,d).getDay();return dow===0||dow===6}
function isPast(iso){const [y,mo,d]=iso.split('-').map(Number);const pick=new Date(y,mo-1,d);const today=new Date();today.setHours(0,0,0,0);return pick<today}

// Inline per-field errors: turn the field red and show a helper under it
function setErr(id,msg){
  const el=$(id), ff=el.closest('.ff'); if(!ff)return;
  ff.classList.add('err');
  let e=ff.querySelector('.ferr'); if(!e){e=document.createElement('div');e.className='ferr';ff.appendChild(e)}
  e.textContent=msg||MSG[id]||'This field is required';
  const clr=()=>ff.classList.remove('err');
  el.addEventListener('input',clr,{once:true});
  el.addEventListener('change',clr,{once:true});
}
function showErr(m){const e=$('errmsg');e.textContent=m;e.style.display='block'}
function clearErr(){$('errmsg').style.display='none'}
function clearAllErrs(){document.querySelectorAll('.ff.err').forEach(f=>f.classList.remove('err'));clearErr()}

// Image pick + client-side compression (staff mode, optional)
function pickImage(input, side){
  const file=input.files && input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=1600; let w=img.width,h=img.height;
      if(Math.max(w,h)>MAX){const s=MAX/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      images[side]=c.toDataURL('image/jpeg',0.8);
      const tile=$('tile-'+side);
      tile.classList.add('has');
      tile.querySelectorAll('.upicon,.uplbl,.upnote,img,.upswap').forEach(n=>n.remove());
      const pv=document.createElement('img');pv.src=images[side];
      const sw=document.createElement('span');sw.className='upswap';sw.textContent='✓ Tap to replace';
      tile.appendChild(pv);tile.appendChild(sw);
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}

async function createVisit(){
  clearAllErrs();
  const fn=$('fn').value.trim(), ln=$('ln').value.trim(), dobMask=$('dob').value, entity=$('entity').value;
  let bad=false;
  if(!fn){setErr('fn');bad=true}
  if(!ln){setErr('ln');bad=true}
  if(!isValidDate(dobMask)){setErr('dob');bad=true}
  if(!entity){setErr('entity');bad=true}

  const payload = {mode, firstName:fn, lastName:ln, dob:maskToIso(dobMask), language:lang, leadEntity:entity};

  if(mode==='send'){
    const pemail=$('pemail').value.trim();
    if(!pemail){setErr('pemail');bad=true}
    else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(pemail)){setErr('pemail','Please enter a valid email address');bad=true}
    payload.patientEmail=pemail;
  } else {
    if(!$('addr').value.trim()){setErr('addr');bad=true}
    if(!$('city').value.trim()){setErr('city');bad=true}
    if(!$('state').value.trim()){setErr('state');bad=true}
    if(!$('zip').value.trim()){setErr('zip');bad=true}
    if(!$('carrier').value.trim()){setErr('carrier');bad=true}
    if(!$('memberid').value.trim()){setErr('memberid');bad=true}
    if(!$('vtime').value){setErr('vtime');bad=true}
    const vdateMask=$('vdate').value;
    if(!isValidDate(vdateMask)){setErr('vdate');bad=true}
    else{
      const iso=maskToIso(vdateMask);
      if(isWeekend(iso)){setErr('vdate','Please choose a weekday (Monday to Friday)');bad=true}
      else if(isPast(iso)){setErr('vdate','Please choose a visit date in the future');bad=true}
    }
    Object.assign(payload,{
      address:$('addr').value.trim(), city:$('city').value.trim(), state:$('state').value.trim(), zip:$('zip').value.trim(),
      insuranceCarrier:$('carrier').value.trim(), insuranceMemberId:$('memberid').value.trim(),
      visitDate:maskToIso(vdateMask), visitTime:$('vtime').value,
      cardFront:images.front||'', cardBack:images.back||''
    });
  }

  if(bad){ document.querySelector('.ff.err')?.scrollIntoView({behavior:'smooth',block:'center'}); return; }

  const btn=$('createbtn');btn.disabled=true;btn.textContent = mode==='staff'?'Scheduling…':'Creating…';
  try{
    const res=await fetch('/api/yvy/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data=await res.json().catch(()=>({error:'Invalid server response'}));
    if(!res.ok||data.error)throw new Error(data.error||'Request failed');

    if(data.scheduled){
      $('oktitle').textContent='Visit scheduled';
      $('okmsg').textContent='The Premier office has been notified. The clinician will complete the attestation at the time of the visit.';
      $('linkbox').style.display='none';
    } else {
      $('oktitle').textContent='Visit created';
      $('plink').value=data.patientLink;
      $('linkbox').style.display='flex';
      $('okmsg').textContent = data.emailSent
        ? 'The link was emailed to the patient. You can also copy it below to share it another way.'
        : (data.emailError
            ? 'The visit was created, but the email could not be sent ('+data.emailError+'). Please share the link below with the patient.'
            : 'Share this personal link with the patient to complete their information and pick a visit time.');
    }
    $('sform').classList.remove('on');
    $('sok').classList.add('on');
    window.scrollTo({top:0,behavior:'smooth'});
  }catch(err){
    showErr((mode==='staff'?'Could not schedule visit: ':'Could not create visit: ')+err.message);
  }finally{
    btn.disabled=false;btn.textContent = mode==='staff'?'Schedule visit →':'Create & send to patient →';
  }
}

function copyLink(){
  const inp=$('plink');inp.select();
  navigator.clipboard.writeText(inp.value).then(()=>{
    $('copybtn').textContent='Copied ✓';
    setTimeout(()=>$('copybtn').textContent='Copy',1800);
  });
}

function another(){
  clearAllErrs();
  ['fn','ln','dob','pemail','addr','city','zip','carrier','memberid','vdate'].forEach(id=>{const el=$(id);if(el)el.value=''});
  $('state').value='NY';
  $('entity').selectedIndex=0; $('vtime').selectedIndex=0;
  images.front=images.back=null;
  ['front','back'].forEach(side=>{
    const tile=$('tile-'+side); if(!tile)return;
    tile.classList.remove('has');
    tile.querySelectorAll('img,.upswap').forEach(n=>n.remove());
    if(!tile.querySelector('.upicon')){
      tile.insertAdjacentHTML('beforeend',
        '<svg class="upicon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7H7l1-1.6A1 1 0 0 1 8.9 5h6.2a1 1 0 0 1 .9.4L17 7h1.5A1.5 1.5 0 0 1 20 8.5v8A1.5 1.5 0 0 1 18.5 18h-13A1.5 1.5 0 0 1 4 16.5z"/><circle cx="12" cy="12" r="3.2"/></svg>'+
        `<span class="uplbl">${side==='front'?'Front':'Back'} of card</span><span class="upnote">Tap to take a photo or upload</span>`);
    }
  });
  $('sok').classList.remove('on');
  $('sform').classList.add('on');
}
</script>
</body>
</html>
