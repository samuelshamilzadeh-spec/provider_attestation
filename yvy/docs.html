<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Attestation Documents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/yvy/yvy.css">
</head>
<body>
<div class="wrap">

<div class="hdr-mark">
  <img src="https://ac4otvimls3ptbdw.public.blob.vercel-storage.com/Icon%20Only.png" alt="Premier Assist">
</div>

<div class="card loading" id="loadmsg">Loading…</div>

<div class="step card" id="sdocs">
  <div class="slbl">Attestation documents <span class="badge ok" id="statusbadge" style="float:right"></span></div>
  <div class="info" id="summary"></div>

  <a class="docbtn" id="pdflink" href="#" target="_blank" rel="noopener">📄 View signed attestation PDF</a>

  <div class="f">
    <label>Insurance card</label>
    <div class="cardimgs" id="cardimgs"></div>
  </div>
</div>

<div class="step card" id="sbad">
  <div class="okwrap">
    <div class="okicon" style="background:var(--er-bg);color:var(--er)">!</div>
    <h2>Documents not found</h2>
    <p>This link is not valid, or the documents are not ready yet.</p>
  </div>
</div>

</div>

<script>
const $ = id => document.getElementById(id);
const token = new URLSearchParams(location.search).get('t');

function show(id){['loadmsg','sdocs','sbad'].forEach(s=>{const el=$(s);el.classList.remove('on');el.style.display=s==='loadmsg'?'none':''});$(id).classList.add('on');if(id==='loadmsg')$(id).style.display=''}
function isoToMask(iso){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');return m?`${m[2]}/${m[3]}/${m[1]}`:iso||''}
function fmtTime(hhmm){if(!hhmm)return'';const[h,m]=hhmm.split(':').map(Number);return`${((h+11)%12)+1}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`}
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}

(async function init(){
  if(!token) return show('sbad');
  let record;
  try{
    const res=await fetch('/api/yvy/record?role=docs&t='+encodeURIComponent(token));
    if(!res.ok) return show('sbad');
    record=await res.json();
  }catch{ return show('sbad') }

  const s=record.submission||{}, c=record.completion||{};
  $('statusbadge').textContent = record.status==='completed' ? 'Completed' : 'In progress';
  $('statusbadge').className = 'badge'+(record.status==='completed'?' ok':'');

  const rows=[
    ['Patient', record.firstName+' '+record.lastName],
    ['DOB', isoToMask(record.dob)],
    ['Lead Entity', record.leadEntity],
    ['Visit', s.visitDate?isoToMask(s.visitDate)+' at '+fmtTime(s.visitTime):'—'],
    ['Insurance', s.insuranceCarrier?`${s.insuranceCarrier} — ${s.insuranceMemberId}`:'—'],
    ['Provider', c.provider||'—'],
    ['Completed', c.completedAt?new Date(c.completedAt).toLocaleString():'—']
  ];
  $('summary').innerHTML = rows.map(([k,v])=>`<div class="irow"><span class="ik">${esc(k)}</span><span class="iv">${esc(v)}</span></div>`).join('');

  if(c.pdfUrl){ $('pdflink').href=c.pdfUrl } else { $('pdflink').style.display='none' }

  if(s.cardFrontUrl){
    $('cardimgs').innerHTML =
      `<a href="${esc(s.cardFrontUrl)}" target="_blank" rel="noopener"><img src="${esc(s.cardFrontUrl)}" alt="Card front"><div class="clbl">Front</div></a>`+
      `<a href="${esc(s.cardBackUrl)}" target="_blank" rel="noopener"><img src="${esc(s.cardBackUrl)}" alt="Card back"><div class="clbl">Back</div></a>`;
  } else {
    $('cardimgs').innerHTML='<div class="note" style="grid-column:1/-1;margin:0">No card photos on file.</div>';
  }

  show('sdocs');
})();
</script>
</body>
</html>
