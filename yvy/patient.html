<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Visit Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/yvy/yvy.css">
</head>
<body>
<div class="wrap">

<div class="hdr-mark">
  <img src="https://ac4otvimls3ptbdw.public.blob.vercel-storage.com/Icon%20Only.png" alt="Premier Assist">
</div>

<div class="card loading" id="loadmsg">Loading…</div>

<!-- ── FORM ── -->
<div class="step card" id="sform">

  <div class="slbl" data-t="yourInfo"></div>
  <div class="row">
    <div class="f"><label data-t="firstName"></label><input type="text" id="fn" readonly></div>
    <div class="f"><label data-t="lastName"></label><input type="text" id="ln" readonly></div>
  </div>
  <div class="row">
    <div class="f"><label data-t="dob"></label><input type="text" id="dob" readonly></div>
    <div></div>
  </div>

  <div class="slbl" style="margin-top:1.5rem" data-t="address"></div>
  <div class="row full">
    <div class="f"><label for="addr" data-t="street"></label><input type="text" id="addr" autocomplete="street-address"></div>
  </div>
  <div class="row">
    <div class="f"><label for="city" data-t="city"></label><input type="text" id="city" autocomplete="address-level2"></div>
    <div class="f" style="display:grid;grid-template-columns:1fr 1.4fr;gap:12px">
      <div class="f"><label for="state" data-t="state"></label><input type="text" id="state" value="NY" maxlength="2" autocomplete="address-level1"></div>
      <div class="f"><label for="zip" data-t="zip"></label><input type="text" id="zip" inputmode="numeric" maxlength="10" autocomplete="postal-code"></div>
    </div>
  </div>

  <div class="slbl" style="margin-top:1.5rem" data-t="insurance"></div>
  <div class="row">
    <div class="f"><label for="carrier" data-t="carrier"></label><input type="text" id="carrier"></div>
    <div class="f"><label for="memberid" data-t="memberId"></label><input type="text" id="memberid"></div>
  </div>
  <div class="f" style="margin-bottom:12px">
    <label data-t="cardPhotos"></label>
    <div class="upgrid">
      <label class="uptile" id="tile-front">
        <input type="file" accept="image/*" onchange="pickImage(this,'front')">
        <span class="upicon">📷</span>
        <span class="uplbl" data-t="cardFront"></span>
        <span class="upnote" data-t="tapUpload"></span>
      </label>
      <label class="uptile" id="tile-back">
        <input type="file" accept="image/*" onchange="pickImage(this,'back')">
        <span class="upicon">📷</span>
        <span class="uplbl" data-t="cardBack"></span>
        <span class="upnote" data-t="tapUpload"></span>
      </label>
    </div>
  </div>

  <div class="slbl" style="margin-top:1.5rem" data-t="whoFilling"></div>
  <div class="row">
    <div class="f">
      <label for="rel" data-t="relationship"></label>
      <select id="rel"></select>
    </div>
    <div class="f" id="fillerwrap" style="display:none">
      <label for="filler" data-t="fillerName"></label>
      <input type="text" id="filler">
    </div>
  </div>

  <div class="slbl" style="margin-top:1.5rem" data-t="schedule"></div>
  <div class="note" id="schednote"></div>
  <div class="row">
    <div class="f"><label for="vdate" data-t="visitDate"></label><input type="date" id="vdate"></div>
    <div class="f"><label for="vtime" data-t="visitTime"></label><select id="vtime"></select></div>
  </div>

  <div class="errmsg" id="errmsg"></div>

  <div class="nav"><div></div><button class="btn btn-p" id="subbtn" onclick="doSubmit()" data-t="submit"></button></div>
</div>

<!-- ── SUCCESS ── -->
<div class="step card" id="sok">
  <div class="okwrap">
    <div class="okicon">✓</div>
    <h2 data-t="okTitle"></h2>
    <p id="oktext"></p>
  </div>
</div>

<!-- ── ERROR / NOT FOUND ── -->
<div class="step card" id="sbad">
  <div class="okwrap">
    <div class="okicon" style="background:var(--er-bg);color:var(--er)">!</div>
    <h2 id="badtitle"></h2>
    <p id="badtext"></p>
  </div>
</div>

</div>

<script src="/yvy/config.js"></script>
<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const visitId = params.get('id');
let record = null, lang = 'en';
const images = { front: null, back: null };

// ── i18n ────────────────────────────────────────────────────────
const T = {
  en: {
    yourInfo:'Your information', firstName:'First name', lastName:'Last name', dob:'Date of birth',
    address:'Home address', street:'Street address', city:'City', state:'State', zip:'ZIP code',
    insurance:'Insurance', carrier:'Insurance carrier', memberId:'Insurance member ID',
    cardPhotos:'Insurance card photos', cardFront:'Front of card', cardBack:'Back of card',
    tapUpload:'Tap to take a photo or upload', replace:'Tap to replace',
    whoFilling:'Person completing this form', relationship:'Relationship to patient',
    fillerName:'Your full name',
    rels:['Self','Parent','Legal guardian','Spouse','Other family member','Other'],
    schedule:'Schedule your visit',
    schedNote:'Visits are by phone, Monday through Friday, between {open} and {close}.',
    visitDate:'Visit date', visitTime:'Visit time', pickTime:'Select a time…',
    submit:'Submit', submitting:'Submitting…',
    okTitle:'Thank you!',
    okText:'Your visit has been scheduled for {when}. A clinician will call you at that time.',
    errFields:'Please complete the highlighted fields.',
    errPhotos:'Please upload photos of the front and back of your insurance card.',
    errWeekend:'Please choose a weekday (Monday to Friday).',
    errPast:'Please choose a date in the future.',
    errSubmit:'Submission failed: ',
    already:'This form was already submitted. Submitting again will update your information.',
    completedTitle:'Visit completed', completedText:'This visit has already taken place. If you need help, please contact the office.',
    notFoundTitle:'Link not found', notFoundText:'This link is not valid. Please contact the office for a new link.'
  },
  es: {
    yourInfo:'Su información', firstName:'Nombre', lastName:'Apellido', dob:'Fecha de nacimiento',
    address:'Dirección de casa', street:'Dirección', city:'Ciudad', state:'Estado', zip:'Código postal',
    insurance:'Seguro médico', carrier:'Compañía de seguro', memberId:'Número de miembro del seguro',
    cardPhotos:'Fotos de la tarjeta de seguro', cardFront:'Frente de la tarjeta', cardBack:'Reverso de la tarjeta',
    tapUpload:'Toque para tomar una foto o subir', replace:'Toque para reemplazar',
    whoFilling:'Persona que completa este formulario', relationship:'Relación con el paciente',
    fillerName:'Su nombre completo',
    rels:['Yo mismo/a','Padre/Madre','Tutor legal','Cónyuge','Otro familiar','Otro'],
    schedule:'Programe su visita',
    schedNote:'Las visitas son por teléfono, de lunes a viernes, entre {open} y {close}.',
    visitDate:'Fecha de la visita', visitTime:'Hora de la visita', pickTime:'Seleccione una hora…',
    submit:'Enviar', submitting:'Enviando…',
    okTitle:'¡Gracias!',
    okText:'Su visita ha sido programada para el {when}. Un clínico le llamará a esa hora.',
    errFields:'Por favor complete los campos marcados.',
    errPhotos:'Por favor suba fotos del frente y reverso de su tarjeta de seguro.',
    errWeekend:'Por favor elija un día entre lunes y viernes.',
    errPast:'Por favor elija una fecha futura.',
    errSubmit:'Error al enviar: ',
    already:'Este formulario ya fue enviado. Si lo envía de nuevo, se actualizará su información.',
    completedTitle:'Visita completada', completedText:'Esta visita ya se realizó. Si necesita ayuda, comuníquese con la oficina.',
    notFoundTitle:'Enlace no encontrado', notFoundText:'Este enlace no es válido. Comuníquese con la oficina para obtener un enlace nuevo.'
  }
};
const t = k => (T[lang] && T[lang][k]) || T.en[k] || k;

function fmtMins(mins){
  const h=Math.floor(mins/60), m=mins%60, am=h>=12?'PM':'AM';
  return `${((h+11)%12)+1}:${String(m).padStart(2,'0')} ${am}`;
}
function isoToMask(iso){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');return m?`${m[2]}/${m[3]}/${m[1]}`:iso||''}

function show(id){['loadmsg','sform','sok','sbad'].forEach(s=>{const el=$(s);el.classList.remove('on');el.style.display=s==='loadmsg'?'none':''});$(id).classList.add('on');if(id==='loadmsg')$(id).style.display=''}
function showErr(m){const e=$('errmsg');e.textContent=m;e.style.display='block';e.scrollIntoView({behavior:'smooth',block:'center'})}
function clearErr(){$('errmsg').style.display='none'}
function mark(id,bad){const el=$(id);el.classList.toggle('err',bad);el.addEventListener('input',()=>el.classList.remove('err'),{once:true})}

// ── INIT ────────────────────────────────────────────────────────
(async function init(){
  if(!visitId) return fail('notFound');
  try{
    const res=await fetch('/api/yvy/record?id='+encodeURIComponent(visitId));
    if(!res.ok) return fail('notFound');
    record=await res.json();
  }catch{ return fail('notFound') }

  lang = record.language==='es'?'es':'en';
  document.documentElement.lang = lang;

  if(record.status==='completed') return fail('completed');

  // Static labels
  document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=t(el.dataset.t)});
  document.title = lang==='es' ? 'Formulario de visita' : 'Visit Form';

  // Prefilled identity
  $('fn').value=record.firstName; $('ln').value=record.lastName; $('dob').value=isoToMask(record.dob);

  // Relationship options
  const rel=$('rel');
  t('rels').forEach((r,i)=>{const o=document.createElement('option');o.value=T.en.rels[i];o.textContent=r;rel.appendChild(o)});
  rel.addEventListener('change',()=>{ $('fillerwrap').style.display = rel.selectedIndex===0 ? 'none':'flex' });

  // Schedule
  const w = window.YVY_SCHEDULE[lang] || window.YVY_SCHEDULE.en;
  $('schednote').textContent = t('schedNote').replace('{open}',fmtMins(w.open)).replace('{close}',fmtMins(w.close));
  const vt=$('vtime');
  const ph=document.createElement('option');ph.value='';ph.disabled=true;ph.selected=true;ph.textContent=t('pickTime');vt.appendChild(ph);
  for(let m=w.open; m+window.YVY_SCHEDULE.slotMinutes<=w.close; m+=window.YVY_SCHEDULE.slotMinutes){
    const o=document.createElement('option');
    o.value=`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
    o.textContent=fmtMins(m);
    vt.appendChild(o);
  }
  const today=new Date();
  $('vdate').min=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  $('vdate').addEventListener('change',()=>{
    clearErr();
    const v=$('vdate').value; if(!v)return;
    const [y,mo,d]=v.split('-').map(Number);
    const dow=new Date(y,mo-1,d).getDay();
    if(dow===0||dow===6){ $('vdate').value=''; mark('vdate',true); showErr(t('errWeekend')); }
  });

  if(record.status==='scheduled'){
    const warn=document.createElement('div');warn.className='warn';warn.textContent=t('already');
    $('sform').prepend(warn);
  }
  show('sform');
})();

function fail(kind){
  if(record){document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=t(el.dataset.t)})}
  $('badtitle').textContent=t(kind==='completed'?'completedTitle':'notFoundTitle');
  $('badtext').textContent=t(kind==='completed'?'completedText':'notFoundText');
  show('sbad');
}

// ── IMAGE PICK + COMPRESS ───────────────────────────────────────
function pickImage(input, side){
  const file=input.files && input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=1600;
      let w=img.width,h=img.height;
      if(Math.max(w,h)>MAX){const s=MAX/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      images[side]=c.toDataURL('image/jpeg',0.8);
      const tile=$('tile-'+side);
      tile.classList.add('has');tile.classList.remove('err');
      tile.querySelectorAll('.upicon,.uplbl,.upnote,img,.upswap').forEach(n=>n.remove());
      const pv=document.createElement('img');pv.src=images[side];
      const sw=document.createElement('span');sw.className='upswap';sw.textContent='✓ '+t('replace');
      tile.appendChild(pv);tile.appendChild(sw);
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}

// ── SUBMIT ──────────────────────────────────────────────────────
async function doSubmit(){
  clearErr();
  let bad=false;
  ['addr','city','state','zip','carrier','memberid'].forEach(id=>{if(!$(id).value.trim()){mark(id,true);bad=true}});
  if(!$('vdate').value){mark('vdate',true);bad=true}
  if(!$('vtime').value){mark('vtime',true);bad=true}
  if(bad) return showErr(t('errFields'));
  if(!images.front||!images.back){
    if(!images.front)$('tile-front').classList.add('err');
    if(!images.back)$('tile-back').classList.add('err');
    return showErr(t('errPhotos'));
  }

  const btn=$('subbtn');btn.disabled=true;btn.textContent=t('submitting');
  try{
    const res=await fetch('/api/yvy/patient-submit',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        id:visitId,
        address:$('addr').value.trim(), city:$('city').value.trim(),
        state:$('state').value.trim(), zip:$('zip').value.trim(),
        insuranceCarrier:$('carrier').value.trim(), insuranceMemberId:$('memberid').value.trim(),
        relationship:$('rel').value, fillerName:$('filler').value.trim(),
        visitDate:$('vdate').value, visitTime:$('vtime').value,
        cardFront:images.front, cardBack:images.back
      })});
    const data=await res.json().catch(()=>({error:'Invalid server response'}));
    if(!res.ok||data.error)throw new Error(data.error||'Submission failed');

    const [h,m]=$('vtime').value.split(':').map(Number);
    const when=`${isoToMask($('vdate').value)} — ${fmtMins(h*60+m)}`;
    $('oktext').textContent=t('okText').replace('{when}',when);
    show('sok');
    window.scrollTo({top:0,behavior:'smooth'});
  }catch(err){
    showErr(t('errSubmit')+err.message);
    btn.disabled=false;btn.textContent=t('submit');
  }
}
</script>
</body>
</html>
